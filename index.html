<style>
:root{--bg:#0f1117;--card:#1b1e27;--tx:#f2f3f7;--mu:#9aa0b0;--ac:#f5b50a}
@media(prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--tx:#14161c;--mu:#5d6475}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
h1{font-size:20px;margin:0}h1 span{color:var(--ac)}
button{font:inherit;cursor:pointer}
#follow{background:var(--ac);color:#000;font-weight:700;font-size:13px;padding:8px 12px;border-radius:20px;text-decoration:none;white-space:nowrap}
.icon{background:none;border:0;color:var(--tx);font-size:20px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:20px;border:1px solid var(--mu);background:none;color:var(--tx);font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#000;font-weight:600}
.ctrl{display:flex;gap:12px;align-items:center;padding:4px 16px 12px;font-size:14px;color:var(--mu);flex-wrap:wrap}
.ctrl input[type=range]{flex:1;min-width:120px;accent-color:var(--ac)}
.ctrl button{background:var(--ac);border:0;border-radius:8px;padding:8px 12px;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:0 16px 16px}
.card{background:var(--card);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#333}
.card .n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);color:var(--ac);font-weight:700;font-size:13px;padding:3px 8px;border-radius:8px}
.card .t{padding:8px 10px;font-size:13px}.card .t small{color:var(--mu);display:block}
#more{display:block;margin:0 auto 24px;padding:10px 24px;border-radius:10px;border:1px solid var(--mu);background:none;color:var(--tx)}
dialog{border:0;border-radius:16px;background:var(--card);color:var(--tx);max-width:420px;width:92%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.7)}
#tv{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:14px}#tv iframe,#tv img{width:100%;height:100%;border:0;object-fit:cover;display:block}#yl{display:inline-block;margin:0 10px 0 0;color:var(--ac);font-size:14px}
dialog .b{padding:14px 16px 18px}dialog h2{margin:0 0 4px;font-size:18px}
dialog p{color:var(--mu);font-size:14px;line-height:1.5}
.msg{padding:24px 16px;text-align:center;color:var(--mu)}
input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--mu);background:var(--bg);color:var(--tx);margin:8px 0}
</style>

<div id="chips"></div>
<div class="ctrl">
 <label>Nota até: <b id="rv">10.0</b></label>
 <input type="range" id="rate" min="5" max="10" step="0.5" value="10">

</div>
<div id="grid"></div>
<div class="msg" id="msg"></div>
<div id="sent" style="height:1px"></div>

<dialog id="det"><div id="tv"></div><div class="b"><h2 id="dt"></h2><p id="dm"></p><p id="do"></p><a id="yl" target="_blank" rel="noopener">Buscar no YouTube</a><button class="chip" onclick="det.close()">Fechar</button></div></dialog>

<script>
const $=id=>document.getElementById(id);
// COLE AQUI O LINK DO SEU CANAL DO YOUTUBE:
const CHANNEL='https://www.youtube.com/@CineIndica-r2d';
if(!CHANNEL.includes('SEUCANAL')){$('follow').href=CHANNEL;$('follow').hidden=false}
const BASE='https://v3-cinemeta.strem.io/catalog/movie/top';
const GENRES=['Action','Adventure','Animation','Biography','Comedy','Crime','Documentary','Drama','Family','Fantasy','History','Horror','Mystery','Romance','Sci-Fi','Sport','Thriller','War','Western'];
const PT={Action:'Ação',Adventure:'Aventura',Animation:'Animação',Biography:'Biografia',Comedy:'Comédia',Crime:'Crime',Documentary:'Documentário',Drama:'Drama',Family:'Família',Fantasy:'Fantasia',History:'História',Horror:'Terror',Mystery:'Mistério',Romance:'Romance','Sci-Fi':'Ficção científica',Sport:'Esporte',Thriller:'Suspense',War:'Guerra',Western:'Faroeste'};
let genre='',skip=0,batches=[],seen=new Set(),last=false,busy=false,gen=0;
const keep=b=>b.filter(m=>m.r<=+$('rate').value).sort((x,y)=>y.r-x.r);
function card(m){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<img loading="lazy" alt="" src="${m.poster||''}"><span class="n">★ ${m.r.toFixed(1)}</span><div class="t">${m.name}<small>${m.year||''}</small></div>`;
  d.onclick=()=>show(m);return d;
}
function render(){
  $('grid').innerHTML='';batches.forEach(b=>keep(b).forEach(m=>$('grid').appendChild(card(m))));
  status();
}
function status(){
  $('msg').textContent=last?($('grid').children.length?'Fim da lista.':'Nenhum filme encontrado.'):'Carregando…';
}
let cur='';
async function show(m){
  cur=m.id;
  const img=m.background||m.poster;
  $('tv').innerHTML=(img?`<img alt="" src="${img}">`:'')+'<span style="position:absolute">Carregando trailer…</span>';
  $('tv').style.position='relative';
  $('dt').textContent=m.name;
  $('dm').textContent=`★ ${m.r.toFixed(1)} IMDb · ${m.year||''}${m.runtime?' · '+m.runtime:''}`;
  $('do').textContent=m.description||'Sem sinopse disponível.';
  $('yl').href='https://www.youtube.com/results?search_query='+encodeURIComponent(`${m.name} ${m.year||''} trailer oficial`);
  $('det').showModal();
  try{
    const d=await (await fetch('https://v3-cinemeta.strem.io/meta/movie/'+m.id+'.json')).json();
    const mt=d.meta||{};
    const t=(mt.trailers||[]).find(x=>x.source);
    const yt=t?t.source:((mt.trailerStreams||[]).find(x=>x.ytId)||{}).ytId;
    if(cur!==m.id)return;
    if(yt)$('tv').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    else $('tv').querySelector('span').textContent='Trailer indisponível. Use o link abaixo.';
  }catch(e){
    if(cur===m.id)$('tv').querySelector('span').textContent='Não foi possível carregar o trailer.';
  }
}
$('det').addEventListener('close',()=>{cur='';$('tv').innerHTML=''});
async function load(reset){
  if(reset){gen++;skip=0;batches=[];seen.clear();last=false;busy=false;$('grid').innerHTML=''}
  if(busy||last)return;
  busy=true;const g=gen;status();
  try{
    const f=[genre&&'genre='+encodeURIComponent(genre),skip&&'skip='+skip].filter(Boolean).join('&');
    const r=await fetch(f?BASE+'/'+f+'.json':BASE+'.json');
    const d=await r.json();if(g!==gen)return;
    const metas=d.metas||[],b=[];
    metas.forEach(m=>{const v=parseFloat(m.imdbRating);if(!isNaN(v)&&!seen.has(m.id)){seen.add(m.id);b.push({...m,r:v})}});
    batches.push(b);keep(b).forEach(m=>$('grid').appendChild(card(m)));
    skip+=metas.length;if(metas.length<50)last=true;
    busy=false;status();setTimeout(check,50);
  }catch(e){busy=false;$('msg').textContent='Erro ao carregar. Role para tentar de novo.'}
}
function check(){if($('sent').getBoundingClientRect().top<innerHeight+800)load(false)}
function init(){
  ['',...GENRES].forEach(g=>{const b=document.createElement('button');b.className='chip'+(g===''?' on':'');b.textContent=g?(PT[g]||g):'Todos';
    b.onclick=()=>{genre=g;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');load(true)};
    $('chips').appendChild(b)});
  load(true);
}
$('rate').oninput=e=>{$('rv').textContent=(+e.target.value).toFixed(1);render();check()};
new IntersectionObserver(check,{rootMargin:'800px'}).observe($('sent'));
addEventListener('scroll',check,{passive:true});
$('rnd').onclick=()=>{const l=batches.flatMap(keep).slice(0,40);if(l.length)show(l[Math.floor(Math.random()*l.length)])};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
init();
</script>
